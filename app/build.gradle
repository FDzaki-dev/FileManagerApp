plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mahasiswa.filemanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.mahasiswa.filemanager"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.4-batch4"
    }

    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/release.keystore")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "filemanager123"
            keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "filemanager"
            keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: "filemanager123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    // Nama file APK output mengikuti versionName secara otomatis (bukan default "app-release.apk"
    // dan bukan hash acak) - supaya tiap batch/versi gampang dibedakan saat troubleshooting.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "FileManager-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    // Batch-4: engine ZIP dengan dukungan password (AES) + level kompresi -
    // java.util.zip bawaan Android tidak bisa password, makanya butuh ini.
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
}
